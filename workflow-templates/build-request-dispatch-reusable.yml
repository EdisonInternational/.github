---
#
# Build Request Dispatch - All Technologies (Reusable Workflow Call)
#
# Single dispatch workflow for the Node, .NET, Python, Docker and iOS
# "Build Requirements" issue forms in EdisonInternational/.github. It runs when
# an issue has the "Self-Service" label and its title starts with
# "[BUILD][NODE]", "[BUILD][DOTNET]", "[BUILD][PYTHON]", "[BUILD][DOCKER]" or
# "[BUILD][IOS]"; the technology is taken from that title prefix.
#
# Issue-form fields are parsed from "### <Label>" headings in the issue body
# and mapped to the `payload` JSON the reusable workflow expects. The reusable
# workflow takes 4 inputs: technology, target_repo, target_branch and payload
# (a JSON object of flat string/boolean values).
#
# Flow: parse-issue -> prepare-helix-values -> create-helix-request ->
# trigger-devops-ci-builder -> commit-generated-workflows.
#
# generate-caller-workflow-master-reusable.yml only generates the caller
# workflow YAML and uploads it as the "generated-yaml" artifact; it does not
# touch this repo. The commit-generated-workflows job downloads that artifact
# and commits the files into .github/workflows on a feature branch.
# target_repo must be this repo (the caller); parse-issue fails otherwise.
#
# Required configuration (repository or organization level):
#   secrets.GH_AW_GITHUB_TOKEN            Token for the agents reusable workflow
#   secrets.HELIX_PASSWORD                Helix ITSM password
#   vars.HELIX_USERNAME                   Helix ITSM username
#   secrets.SELF_SERVICE_APP_ID           Self-service GitHub App ID
#   secrets.SELF_SERVICE_APP_PRIVATE_KEY  Self-service GitHub App private key
#   Generated workflows only:
#     docker: vars.AZURE_ACR_REGISTRY_NAME, secrets.ACR_PASSWORD,
#             secrets.GCP_SERVICE_ACCOUNT_KEY
#     ios:    secrets.APPLE_USERNAME, secrets.APPLE_PASSWORD, plus the signing,
#             SonarQube and Nexus secrets
#
name: Build Request Dispatch (Reusable Workflow)

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: read
  copilot-requests: write

jobs:
  parse-issue:
    if: >-
      contains(github.event.issue.labels.*.name, 'Self-Service') && (
        startsWith(github.event.issue.title, '[BUILD][NODE]') ||
        startsWith(github.event.issue.title, '[BUILD][DOTNET]') ||
        startsWith(github.event.issue.title, '[BUILD][PYTHON]') ||
        startsWith(github.event.issue.title, '[BUILD][DOCKER]') ||
        startsWith(github.event.issue.title, '[BUILD][IOS]')
      )
    runs-on: ubuntu-latest
    outputs:
      technology: ${{ steps.parse.outputs.technology }}
      target_repo: ${{ steps.parse.outputs.target_repo }}
      target_branch: ${{ steps.parse.outputs.target_branch }}
      payload: ${{ steps.parse.outputs.payload }}
    steps:
      - name: Parse build requirements issue form
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';

            // Capture everything under a "### <Label>" heading up to the next
            // heading (or end of body) so multi-line textarea fields survive.
            function extractField(label) {
              // Labels such as ".NET Version" contain regex metacharacters.
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`###\\s+${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s|$)`);
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              // Issue forms render an unselected optional dropdown as "None".
              return value === '_No response_' || value === 'None' ? '' : value;
            }

            // Checkbox fields render as "- [x] <option>" when ticked.
            function isChecked(label) {
              return /- \[[xX]\]/.test(extractField(label));
            }

            function extractRows(label) {
              return extractField(label).split('\n').map(s => s.trim()).filter(Boolean);
            }

            // Pairs each Target Env row with the Asset Name on the same row.
            function envAssetPairs(keepEmptyAssets) {
              const envs = extractRows('Target Env');
              const assets = extractRows('Asset Name');
              const pairs = envs
                .map((env, i) => (assets[i] || keepEmptyAssets
                  ? `target_env: ${env}, asset_name: ${assets[i] || ''}`
                  : ''))
                .filter(Boolean);
              return { envs, pairs };
            }

            // The agents repo rejects unknown keys, nested values and non-boolean
            // booleans. Empty strings mean "not passed" and fall back to the
            // reusable workflow's defaults.
            const builders = {
              node() {
                const { envs, pairs } = envAssetPairs(true);
                return {
                  project: extractField('Project') || '.',
                  component: extractField('Component'),
                  unit_test_path: extractField('Unit Test Path'),
                  additional_input: envs.length
                    ? `${pairs.join(', ')}. BUILD_ENV: ${envs.join(',')}`
                    : '',
                  deployment_type: extractField('Deployment Type'),
                  slot_name: extractField('Slot Name'),
                  app_type: extractField('App Type'),
                  node_version: extractField('Node Version'),
                  sonar_sources: extractField('Sonar Sources'),
                  test_command: extractField('Test Command'),
                  coverage_exclusions: extractField('Coverage Exclusions'),
                  legacy_peer_deps: isChecked('Legacy Peer Deps'),
                  quality_gate_check: isChecked('Quality Gate Check'),
                };
              },
              dotnet() {
                const { envs, pairs } = envAssetPairs(true);
                return {
                  project: extractField('Project') || '.',
                  component: extractField('Component'),
                  unit_test_path: extractField('Unit Test Path'),
                  additional_input: envs.length ? `${pairs.join(', ')}.` : '',
                  deployment_type: extractField('Deployment Type'),
                  slot_name: extractField('Slot Name'),
                  sub_projects: extractField('Sub Projects'),
                  dotnet_version: extractField('.NET Version'),
                  build_additional_args: extractField('Build Additional Args'),
                  publish_command: extractField('Publish Command'),
                  publish: isChecked('Publish'),
                  obj_dir_fallback: isChecked('Obj Dir Fallback'),
                };
              },
              python() {
                // Rows without both values are dropped so the agent never sees an empty asset.
                const { envs, pairs } = envAssetPairs(false);
                return {
                  project: extractField('Project') || '.',
                  component: extractField('Component'),
                  target_env: envs[0] || '',
                  additional_input: pairs.length ? `${pairs.join(', ')}.` : '',
                  deployment_type: extractField('Deployment Type'),
                  deployment_method: extractField('Deployment Method'),
                  slot_name: extractField('Slot Name'),
                  python_version: extractField('Python Version'),
                  package_mode: extractField('Package Mode'),
                  pre_build: extractField('Pre Build'),
                  post_build: extractField('Post Build'),
                  // Only sent when ticked so an unticked box does not emit SKIP_UNIT_TESTS: false.
                  skip_unit_tests: isChecked('Skip Unit Tests') ? true : '',
                  quality_gate_check: isChecked('Quality Gate Check'),
                  sonar_exclusions: extractField('Sonar Exclusions'),
                  sonar_project_name: extractField('Sonar Project Name'),
                };
              },
              docker() {
                const payload = {
                  project: extractField('Project') || '.',
                  dockerfile: extractField('Dockerfile'),
                  component: extractField('Component'),
                  asset_name: extractField('Asset Name'),
                  registry_host: extractField('Registry Host'),
                  image_name: extractField('Image Name'),
                  target_env: extractField('Target Env'),
                  kubernetes_manifests: extractField('Kubernetes Manifests'),
                  image_placeholder: extractField('Image Placeholder'),
                  deploy_runner: extractField('Deploy Runner'),
                  runner: extractField('Build Runner'),
                  gke_cluster: extractField('GKE Cluster'),
                  gcp_region: extractField('GCP Region'),
                  sed_substitutions: extractField('Manifest Substitutions'),
                  scan_container: isChecked('Scan Container'),
                  quality_gate_check: isChecked('Dockerfile Check (PR)'),
                };
                const required = [
                  'asset_name',
                  'registry_host',
                  'image_name',
                  'target_env',
                  'kubernetes_manifests',
                  'image_placeholder',
                  'deploy_runner',
                ];
                const missing = required.filter(key => !payload[key]);
                if (missing.length) {
                  throw new Error(`Missing required field(s): ${missing.join(', ')}`);
                }
                return payload;
              },
              ios() {
                // The "Skip ..." checkboxes are inverted so leaving them unticked keeps the default (enabled).
                const payload = {
                  project: extractField('Project'),
                  xcode_project: extractField('Xcode Project'),
                  scheme: extractField('Scheme'),
                  target_env: extractField('Target Env'),
                  runner: extractField('Build Runner'),
                  xcode_version: extractField('Xcode Version'),
                  runner_version: extractField('Runner Version'),
                  envfile: extractField('Env File'),
                  sonar_exclusions: extractField('Sonar Exclusions'),
                  ui_test_target: extractField('UI Test Target'),
                  auto_manage_signing: isChecked('Auto Manage Signing'),
                  skip_unit_tests: isChecked('Skip Unit Tests'),
                  quality_gate_check: isChecked('Fail PRs on Quality Gate'),
                  include_nexus_upload: !isChecked('Skip Nexus Upload'),
                  deploy_testflight: !isChecked('Skip TestFlight Deploy'),
                  strict_security: !isChecked('Skip Strict Security Check'),
                };
                if (!payload.scheme) {
                  throw new Error('Missing required field(s): scheme');
                }
                return payload;
              },
            };

            try {
              const prefix = title.match(/^\[BUILD\]\[(NODE|DOTNET|PYTHON|DOCKER|IOS)\]/i);
              if (!prefix) {
                throw new Error(`Unsupported issue title: "${title}"`);
              }
              const technology = prefix[1].toLowerCase();

              const repositoryName = extractField('Target Repo');
              if (!repositoryName) {
                throw new Error('Target Repo is required');
              }

              // Prevent an issue from generating workflows for another repository.
              const targetRepo = repositoryName.split('/').pop();
              if (targetRepo !== context.payload.repository.name) {
                throw new Error(
                  `Target Repo '${targetRepo}' does not match this repository '${context.payload.repository.name}'`
                );
              }

              const payload = builders[technology]();

              core.setOutput('technology', technology);
              core.setOutput('target_repo', targetRepo);
              core.setOutput('target_branch', extractField('Target Branch') || 'main');
              core.setOutput('payload', JSON.stringify(payload));
            } catch (error) {
              core.setFailed(error.message);
            }

  # Maps the issue to Helix field names; create-helix-request sends
  # REQUEST_FIELDS unchanged. jq --arg keeps the free-text values JSON-safe.
  prepare-helix-values:
    needs: parse-issue
    runs-on: ubuntu-latest
    outputs:
      request_fields: ${{ steps.build.outputs.request_fields }}
    steps:
      - id: build
        env:
          TECHNOLOGY: ${{ needs.parse-issue.outputs.technology }}
          COMPONENT: >-
            ${{ format('Submitted by GitHub user "{0}" for technology "{1}". Run: {2}/{3}/actions/runs/{4}', github.event.issue.user.login, needs.parse-issue.outputs.technology, github.server_url, github.repository, github.run_id) }}
          TARGET_REPO: ${{ github.event.repository.name }}
          SOURCE_KEYWORD: 'Devops Self-Service Portal - API'
        run: |
          set -euo pipefail
          request_fields=$(jq -cn \
            --arg technology "$TECHNOLOGY" \
            --arg component "$COMPONENT" \
            --arg target_repo "$TARGET_REPO" \
            --arg source_keyword "$SOURCE_KEYWORD" \
            '{
              "SR Type Field 10": $technology,
              "SR Type Field 11": $target_repo,
              "SR Type Field 12": $component,
              "Source Keyword": $source_keyword
            }')
          printf 'request_fields=%s\n' "$request_fields" >> "$GITHUB_OUTPUT"

  create-helix-request:
    needs: [parse-issue, prepare-helix-values]
    uses: EdisonInternational/actions/.github/workflows/create-helix-request.yml@main
    with:
      ITSM_ENVIRONMENT: uat
      # SERVICE_REQUEST_DEFINITION_ID: ${{ vars.TITLE_INSTANCE_ID }}
      REQUEST_FIELDS: ${{ needs.prepare-helix-values.outputs.request_fields }}
    secrets:
      HELIX_PASSWORD: ${{ secrets.HELIX_PASSWORD }}

  trigger-devops-ci-builder:
    needs: [parse-issue, create-helix-request]
    uses: EdisonInternational/agents/.github/workflows/generate-caller-workflow-master-reusable.yml@main
    with:
      technology: ${{ needs.parse-issue.outputs.technology }}
      target_repo: ${{ needs.parse-issue.outputs.target_repo }}
      target_branch: ${{ needs.parse-issue.outputs.target_branch }}
      payload: ${{ needs.parse-issue.outputs.payload }}
    secrets:
      GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}

  commit-generated-workflows:
    needs: [parse-issue, trigger-devops-ci-builder]
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived installation token from the org GitHub App. The
      # App has Workflows: write, so unlike GITHUB_TOKEN it can push files
      # under .github/workflows. Installed org-wide, so no per-repo secrets.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SELF_SERVICE_APP_ID }}
          private-key: ${{ secrets.SELF_SERVICE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse-issue.outputs.target_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download generated workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-yaml
          path: .github/workflows

      - name: Create branch and commit generated workflows
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          branch="feature/self-service-${ISSUE_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add .github/workflows

          if git diff --cached --quiet; then
            echo "::error::No workflow files were generated by the DevOps CI Builder"
            exit 1
          fi

          git commit -m "Add self-service CI workflows (issue #${ISSUE_NUMBER})"
          git push origin "$branch"
