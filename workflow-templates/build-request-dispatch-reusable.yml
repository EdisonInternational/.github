---
#
# Build Request Dispatch (Reusable Workflow Call)
#
# Alternative to build-request-dispatch.yml that avoids the REST API
# dispatch-and-poll pattern. Instead, this calls
# generate-caller-workflow-master-reusable.yml in EdisonInternational/agents
# directly as a reusable workflow (`uses:`), letting GitHub Actions itself
# wait for completion.
#
# No PAT is needed: target_repo is always this repo (the caller), and a
# reusable workflow's GITHUB_TOKEN is scoped to the caller, not to the repo
# where the called workflow's YAML lives. This requires
# generate-caller-workflow-master-reusable.yml to use GITHUB_TOKEN (not
# WORKFLOW_PAT) for its checkout/PR steps.
#
# The ref is pinned to `main` because reusable workflow refs in `uses:`
# must be static and cannot come from a variable/expression.
#
name: Build Request Dispatch (Reusable Workflow)

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: read

jobs:
  parse-issue:
    if: contains(github.event.issue.labels.*.name, 'Self-Service')
    runs-on: ubuntu-latest
    outputs:
      technology: ${{ steps.parse.outputs.technology }}
      target_repo: ${{ steps.parse.outputs.target_repo }}
      target_branch: ${{ steps.parse.outputs.target_branch }}
      project: ${{ steps.parse.outputs.project }}
      component: ${{ steps.parse.outputs.component }}
      unit_test_path: ${{ steps.parse.outputs.unit_test_path }}
      app_type: ${{ steps.parse.outputs.app_type }}
      node_version: ${{ steps.parse.outputs.node_version }}
      legacy_peer_deps: ${{ steps.parse.outputs.legacy_peer_deps }}
      additional_input: ${{ steps.parse.outputs.additional_input }}
      sonar_sources: ${{ steps.parse.outputs.sonar_sources }}
      test_command: ${{ steps.parse.outputs.test_command }}
      quality_gate_check: ${{ steps.parse.outputs.quality_gate_check }}
      coverage_exclusions: ${{ steps.parse.outputs.coverage_exclusions }}
      dotnet_project_name: ${{ steps.parse.outputs.dotnet_project_name }}
    steps:
      - name: Parse issue form fields
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            function extractField(label) {
              const regex = new RegExp(`### ${label}\\s*\\n+([^\\n]+)`);
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              return (!value || value === '_No response_') ? '' : value;
            }
            function extractCheckbox(label) {
              return /\[x\]/i.test(extractField(label));
            }
            function extractMultilineField(label) {
              const regex = new RegExp(`### ${label}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              return (!value || value === '_No response_') ? '' : value;
            }

            const technology = extractField('Technology');
            const targetRepoRaw = extractField('Target Repo');
            const targetBranch = extractField('Target Branch');
            const project = extractField('Project');
            const component = extractField('Component');
            const unitTestPath = extractField('Unit Test Path');
            const appType = extractField('App Type');
            const nodeVersion = extractField('Node Version');
            const legacyPeerDeps = extractCheckbox('Legacy Peer Deps');
            const targetEnv = extractField('Target Env');
            const assetName = extractField('Asset Name');
            // one `key: value` pair per line, added by the user as needed
            const additionalParamLines = extractMultilineField('Additional Parameters')
              .split('\n').map(line => line.trim()).filter(Boolean);
            const additionalInput = [
              targetEnv && `target_env: ${targetEnv}`,
              assetName && `asset_name: ${assetName}`,
              ...additionalParamLines,
            ].filter(Boolean).join(', ');
            const sonarSources = extractField('Sonar Sources');
            const testCommand = extractField('Test Command');
            const qualityGateCheck = extractCheckbox('Quality Gate Check');
            const coverageExclusions = extractField('Coverage Exclusions');
            const dotnetProjectName = extractField('Project Name');

            if (!technology) {
              core.setFailed(`Unsupported or missing Technology: "${technology}"`);
              return;
            }
            if (!targetRepoRaw) {
              core.setFailed('Target Repo is required');
              return;
            }
            // basename strips any "org/" prefix so only the repo name is sent
            const target_repo = targetRepoRaw.split('/').pop();

            core.setOutput('technology', technology);
            core.setOutput('target_repo', target_repo);
            core.setOutput('target_branch', targetBranch || 'main');
            core.setOutput('project', project || '.');
            core.setOutput('component', component);
            core.setOutput('unit_test_path', unitTestPath);
            core.setOutput('app_type', appType);
            core.setOutput('node_version', nodeVersion);
            core.setOutput('legacy_peer_deps', legacyPeerDeps);
            core.setOutput('additional_input', additionalInput);
            core.setOutput('sonar_sources', sonarSources);
            core.setOutput('test_command', testCommand);
            core.setOutput('quality_gate_check', qualityGateCheck);
            core.setOutput('coverage_exclusions', coverageExclusions);
            core.setOutput('dotnet_project_name', dotnetProjectName);
  trigger-devops-ci-builder:
    needs: parse-issue
    uses: EdisonInternational/agents/.github/workflows/generate-caller-workflow-master-reusable.yml@reusable-caller-workflow
    with:
      technology: ${{ needs.parse-issue.outputs.technology }}
      target_repo: ${{ needs.parse-issue.outputs.target_repo }}
      target_branch: ${{ needs.parse-issue.outputs.target_branch }}
      project: ${{ needs.parse-issue.outputs.project }}
      component: ${{ needs.parse-issue.outputs.component }}
      unit_test_path: ${{ needs.parse-issue.outputs.unit_test_path }}
      app_type: ${{ needs.parse-issue.outputs.app_type }}
      node_version: ${{ needs.parse-issue.outputs.node_version }}
      legacy_peer_deps: ${{ needs.parse-issue.outputs.legacy_peer_deps == 'true' }}
      additional_input: ${{ needs.parse-issue.outputs.additional_input }}
      sonar_sources: ${{ needs.parse-issue.outputs.sonar_sources }}
      test_command: ${{ needs.parse-issue.outputs.test_command }}
      quality_gate_check: ${{ needs.parse-issue.outputs.quality_gate_check == 'true' }}
      coverage_exclusions: ${{ needs.parse-issue.outputs.coverage_exclusions }}
      dotnet_project_name: ${{ needs.parse-issue.outputs.dotnet_project_name }}
