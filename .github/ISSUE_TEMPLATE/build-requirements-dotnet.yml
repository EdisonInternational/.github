name: Build Requirements (.NET)
description: Request a new build pipeline or report build requirements for a .NET repository
title: "[BUILD][DOTNET] "
labels: ["build", "needs-triage", "agentic-workflow:build"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to submit .NET build requirements for a repository. This template is shared across the organization.

        ### Technology
        dotnet

  - type: input
    id: target_repo
    attributes:
      label: Target Repo
      description: The name of the repository the build is for.
      placeholder: e.g. self-service-dotnet-webapp
    validations:
      required: true

  - type: input
    id: target_branch
    attributes:
      label: Target Branch
      description: Branch of the target repository to base the build on. Defaults to "main" if left blank.
      placeholder: main
    validations:
      required: false

  - type: input
    id: project
    attributes:
      label: Project
      description: The path of the project within the repository. Defaults to "." if left blank.
      placeholder: "."
    validations:
      required: false

  - type: input
    id: component
    attributes:
      label: Component
      description: The component being built.
      placeholder: webapp
    validations:
      required: false

  - type: input
    id: unit_test_path
    attributes:
      label: Unit Test Path
      description: The path to the unit tests.
      placeholder: e.g. SelfServiceDotnetWebapp.Api.Tests
    validations:
      required: false

  - type: input
    id: sub_projects
    attributes:
      label: Sub Projects
      description: Additional project(s)/csproj path(s) to build. Comma-separate multiple paths.
      placeholder: e.g. ADRAPI/ADRAPI/ADRAPI.csproj
    validations:
      required: false

  - type: input
    id: dotnet_version
    attributes:
      label: .NET Version
      description: The .NET SDK version to use.
      placeholder: e.g. 8.0.x
    validations:
      required: false

  - type: input
    id: build_additional_args
    attributes:
      label: Build Additional Args
      description: Additional arguments to pass to the build/publish command.
      placeholder: e.g. /p:DeployOnBuild=true /p:PublishProfile=FolderProfile
    validations:
      required: false

  - type: input
    id: publish_command
    attributes:
      label: Publish Command
      description: The MSBuild target used to publish the project.
      placeholder: e.g. /t:Publish
    validations:
      required: false

  - type: checkboxes
    id: publish
    attributes:
      label: Publish
      options:
        - label: Publish the build output
    validations:
      required: false

  - type: checkboxes
    id: obj_dir_fallback
    attributes:
      label: Obj Dir Fallback
      options:
        - label: Fall back to the default obj directory
    validations:
      required: false

  - type: textarea
    id: target_env
    attributes:
      label: Target Env
      description: The target environment(s) for this build. Add one per line to add multiple; paired by row with Asset Name below.
      placeholder: |
        qa
        staging
    validations:
      required: false

  - type: textarea
    id: asset_name
    attributes:
      label: Asset Name
      description: The asset name(s) to use for this build. Add one per line, matching the order of Target Env above.
      placeholder: |
        self-service-dotnet-webapp-qa
        self-service-dotnet-webapp-st
    validations:
      required: false

  - type: input
    id: dotnet_project_name
    attributes:
      label: Project Name
      description: The .NET project name.
      placeholder: e.g. HelloWorld
    validations:
      required: false
